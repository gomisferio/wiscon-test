<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wisconsin Card Sorting Test - Clínico Avanzado</title>
    
    <style>
        @import url('https://cdn.jsdelivr.net/npm/opendyslexic@1.0.3/opendyslexic.min.css');
    </style>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg-color: #f2f2f7;
            --text-color: #1c1c1e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: none;
            color: var(--text-color);
        }

        /* Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        /* Header simplificado */
        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            background: rgba(255,255,255,0.6);
            border-bottom: 1px solid rgba(255,255,255,0.5);
            z-index: 10;
        }

        .score-pill {
            padding: 6px 25px;
            border-radius: 20px;
        }

        /* Contenedor de juego espaciado al extremo */
        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            align-items: center;
            position: relative;
            padding: 20px 15px; 
            height: calc(100vh - 60px);
        }

        .bases-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px; 
            width: 100%;
            max-width: 800px;
        }

        /* MODIFICADO: Espaciado masivo por arriba y por abajo (+50px) para distanciar las tarjetas */
        .middle-brand {
            font-family: 'OpenDyslexic', 'Segoe UI', sans-serif !important;
            font-size: 1.6rem !important; 
            font-weight: bold;
            color: rgba(28, 28, 30, 0.6) !important;
            text-align: center;
            width: 100%;
            margin-top: 50px !important;    /* Forzado de separación superior */
            margin-bottom: 50px !important; /* Forzado de separación inferior */
            letter-spacing: 1px;
            pointer-events: none;
            display: block !important;
            visibility: visible !important;
        }

        /* Posicionamiento bajo de la tarjeta inferior */
        .deck-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-top: auto; 
            margin-bottom: 1vh; 
        }

        .card {
            width: 100%;
            aspect-ratio: 1 / 1.3;
            max-width: 135px;
            max-height: 175px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .draggable {
            cursor: grab;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            z-index: 50;
            width: 135px;
            height: 175px;
        }

        .dragging {
            cursor: grabbing;
            transition: none;
            transform: scale(1.05);
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            z-index: 100;
        }

        .shapes-grid {
            display: grid;
            width: 80%;
            height: 80%;
            align-items: center;
            justify-items: center;
            gap: 5px;
        }

        .grid-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
        .grid-2 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
        .grid-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .grid-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

        .shape-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .shape-svg {
            width: 100%;
            height: 100%;
            max-width: 42px;
            max-height: 42px;
            object-fit: contain;
        }

        /* Feedback Animation Overlays */
        .feedback-overlay {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 140px;
            height: 140px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
        }

        .feedback-correct {
            background: rgba(52, 199, 89, 0.9);
            box-shadow: 0 0 40px rgba(52, 199, 89, 0.6);
            animation: popIn 0.8s ease forwards;
        }

        .feedback-incorrect {
            background: rgba(255, 59, 48, 0.9);
            box-shadow: 0 0 40px rgba(255, 59, 48, 0.6);
            animation: shake 0.5s ease forwards;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        @keyframes shake {
            0% { transform: translate(-50%, -50%) scale(1) translateX(0); opacity: 1; }
            20% { transform: translate(-50%, -50%) scale(1) translateX(-12px); }
            40% { transform: translate(-50%, -50%) scale(1) translateX(12px); }
            60% { transform: translate(-50%, -50%) scale(1) translateX(-12px); }
            80% { transform: translate(-50%, -50%) scale(1) translateX(12px); }
            100% { transform: translate(-50%, -50%) scale(1) translateX(0); opacity: 0; }
        }

        svg.icon { width: 70px; height: 70px; fill: white; }

        /* Report Screen */
        .report-container {
