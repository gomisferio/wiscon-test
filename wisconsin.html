<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wisconsin Card Sorting Test - 36 Ensayos</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f2f2f7;
            --text-color: #1c1c1e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            touch-action: none;
            color: var(--text-color);
        }

        /* Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        .header {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            background: rgba(255,255,255,0.6);
            border-bottom: 1px solid rgba(255,255,255,0.5);
            z-index: 10;
        }

        .score-pill {
            padding: 6px 14px;
            border-radius: 20px;
        }

        .aciertos { color: #28a745; }
        .errores { color: #dc3545; }

        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* Alineación superior para empujar el mazo hacia abajo */
            align-items: center;
            position: relative;
            padding: 15px 10px;
            height: calc(100vh - 60px);
        }

        .bases-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 800px;
            margin-bottom: 5vh; /* Distancia respecto a las tarjetas superiores */
        }

        /* Posicionamiento ergonómico medio-bajo para la carta activa */
        .deck-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-top: auto; 
            margin-bottom: 8vh; /* Margen de seguridad inferior para la mano */
        }

        .card {
            width: 100%;
            aspect-ratio: 1 / 1.3;
            max-width: 135px;
            max-height: 175px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .draggable {
            cursor: grab;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
