<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wisconsin Card Sorting Test - Clínico Avanzado</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg-color: #f2f2f7;
            --text-color: #1c1c1e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: none;
            color: var(--text-color);
        }

        /* Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        /* HEADER SIMPLIFICADO */
        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            background: rgba(255,255,255,0.6);
            border-bottom: 1px solid rgba(255,255,255,0.5);
            z-index: 10;
        }

        .score-pill {
            padding: 6px 25px;
            border-radius: 20px;
        }

        /* DISTRIBUCIÓN ESPACIADA IDÉNTICA A LA CAPTURA */
        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            align-items: center;
            position: relative;
            padding: 4vh 10vw 8vh 10vw; /* Márgenes fluidos que empujan los elementos */
            height: calc(100vh - 60px);
        }

        .bases-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 40px; /* Separación amplia entre las 4 tarjetas superiores */
            width: 100%;
            max-width: 750px;
            justify-items: center;
        }

        /* TIPOGRAFÍA BOULDER (Gruesa, Blanca, Centrada) */
        .middle-brand {
            font-family: 'Arial Black', 'Impact', sans-serif !important;
            font-size: 2.5rem !important; 
            font-weight: 900;
            color: rgba(255, 255, 255, 0.85) !important; /* Blanco sólido traslúcido */
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.05);
            text-transform: uppercase;
            text-align: center;
            width: 100%;
            letter-spacing: 2px;
            pointer-events: none;
            display: block !important;
            margin: auto 0;
        }

        /* CONTENEDOR DE LA CARTA INFERIOR */
        .deck-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        /* TAMAÑO DE TARJETAS PROPORCIONAL A LA IMAGEN */
        .card, .base-dropzone {
            width: 115px;
            height: 155px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .draggable {
            cursor: grab;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            z-index: 50;
        }

        .dragging {
            cursor: grabbing;
            transition: none;
            transform: scale(1.05);
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            z-index: 100;
        }

        .shapes-grid {
            display: grid;
            width: 75%;
            height: 75%;
            align-items: center;
            justify-items: center;
            gap: 8px;
        }

        .grid-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
        .grid-2 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
        .grid-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .grid-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

        .shape-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .shape-svg {
            width: 100%;
            height: 100%;
            max-width: 38px;
            max-height: 38px;
            object-fit: contain;
        }

        /* Feedback Animation Overlays */
        .feedback-overlay {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 140px;
            height: 140px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
        }

        .feedback-correct {
            background: rgba(52, 199, 89, 0.9);
            box-shadow: 0 0 40px rgba(52, 199, 89, 0.6);
            animation: popIn 0.8s ease forwards;
        }

        .feedback-incorrect {
            background: rgba(255, 59, 48, 0.9);
            box-shadow: 0 0 40px rgba(255, 59, 48, 0.6);
            animation: shake 0.5s ease forwards;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        @keyframes shake {
            0% { transform: translate(-50%, -50%) scale(1) translateX(0); opacity: 1; }
            20% { transform: translate(-50%, -50%) scale(1) translateX(-12px); }
            40% { transform: translate(-50%, -50%) scale(1) translateX(12px); }
            60% { transform: translate(-50%, -50%) scale(1) translateX(-12px); }
            80% { transform: translate(-50%, -50%) scale(1) translateX(12px); }
            100% { transform: translate(-50%, -50%) scale(1) translateX(0); opacity: 0; }
        }

        svg.icon { width: 70px; height: 70px; fill: white; }

        /* Report Screen */
        .report-container {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
            width: 100%;
            min-height: 100vh;
            overflow-y: auto;
            user-select: text;
            -webkit-user-select: text;
        }

        .report-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border-radius: 24px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            margin-bottom: 20px;
        }

        .report-card h2 { margin-bottom: 20px; color: #1c1c1e; font-size: 1.4rem; }
        
        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            font-size: 1.05rem;
        }
        .metric-row:last-child { border-bottom: none; }
        .metric-val { font-weight: bold; color: #5856d6; }

            width: 100%;
            margin-top: 25px;
            padding: 10px;
            background: white;
            border-radius: 16px;
            border: 1
