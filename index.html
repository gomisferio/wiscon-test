<!DOCTYPE html>
<html lang="es">
<head>

    <title>Wisconsin Card Sorting Test - Táctil</title>

        :root {
            --bg-color: #f2f2f7;
            --text-color: #1c1c1e;

        * {

            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: none; /* Fundamental para evitar scroll accidental en táctil */
            color: var(--text-color);
        }

        /* Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

            z-index: 1000;
            padding: 20px;
        }

            max-width: 500px;
            text-align: center;
            display: flex;
            flex-direction: column;

            margin-bottom: 10px;

            flex-direction: column;
            gap: 15px;
